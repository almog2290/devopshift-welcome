apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: madaralmog/docker-backend:1.0
        ports:
        - containerPort: 5003
        env:
          - name: MYSQL_HOST
            value: mysqldb-service
          - name: MYSQL_DATABASE
            value: crypto_db
          - name: MYSQL_USER
            value: root
          - name: MYSQL_PASSWORD
            value: "123456"        
        
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5003     
      targetPort: 5003