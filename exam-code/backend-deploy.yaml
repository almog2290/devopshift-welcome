apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: madaralmog/docker-backend-service:2.1
        ports:
        - containerPort: 5001
        env:
          - name: MYSQL_HOST
            value: mysql-service
          - name: MYSQL_USER
            value: root
          - name: MYSQL_PASSWORD
            value: "123456"        
        
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5001     
      targetPort: 5001