services:
  web:
    build: ./fe
    ports:
      - "5002:5002"
    networks:
      - crypto
  backend-service:
    build: ./be
    depends_on:
      mysqldb:
        condition: service_healthy
    ports:
      - "5003:5001"
    networks:
      - crypto
    environment:
      MYSQL_HOST: mysqldb
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
  mysqldb:
    image: mysql:8.0
    ports:
      - "3306:3306"
    networks:
      - crypto
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: crypto_db
      MYSQL_ROOT_PASSWORD: 123456
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=123456"]
      interval: 30s
      retries: 10
      start_period: 60s

      
networks:
  crypto:
    driver: bridge

volumes:
  db_data:

  



  